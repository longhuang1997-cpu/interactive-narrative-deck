<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战略汇报示例 - Interactive Narrative Deck</title>
<style>
/* Interactive Narrative Deck · 样式 */
:root{--nd-blue:#2563eb;--nd-gold:#e8c874;--nd-ink:#e8eef9;--nd-sub:#9fb0ca;--nd-bg:#0b1220;--nd-card:rgba(255,255,255,.05);--nd-line:rgba(255,255,255,.1);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:"Microsoft YaHei","STHeiti",system-ui,sans-serif;background:radial-gradient(ellipse at 20% 0%,rgba(37,99,235,.18),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(232,200,116,.12),transparent 55%),var(--nd-bg);color:var(--nd-ink);}
#nd-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 8vw;}
.nd-slide{width:100%;max-width:1200px;}
.nd-layout-center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;}
.nd-layout-left{display:flex;flex-direction:column;align-items:flex-start;gap:22px;}
.nd-layout-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
@keyframes ndIn{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:none;}}
[data-frag]{opacity:.12;transition:opacity .4s,transform .4s;filter:blur(.4px);}
[data-frag].nd-show{opacity:1;filter:none;}
.nd-hero-wrap{width:100%;}
.nd-kick{color:var(--nd-gold);font-size:22px;letter-spacing:4px;margin-bottom:14px;}
.nd-hero h1{font-size:66px;line-height:1.15;font-weight:800;background:linear-gradient(120deg,#fff,#cfe0ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.nd-goldline{width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--nd-gold),transparent);margin:22px auto;}
.nd-layout-left .nd-goldline{margin:22px 0;}
.nd-sub{font-size:26px;color:var(--nd-sub);line-height:1.6;}
h2{font-size:40px;font-weight:700;margin-bottom:8px;}
.nd-metrics{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;}
.nd-metric{background:var(--nd-card);border:1px solid var(--nd-line);border-radius:20px;padding:30px 38px;min-width:200px;position:relative;backdrop-filter:blur(6px);}
.nd-mnum{font-size:64px;font-weight:800;color:var(--nd-gold);line-height:1;}
.nd-munit{display:inline;font-size:22px;color:var(--nd-sub);margin-left:4px;}
.nd-mlabel{font-size:20px;color:var(--nd-sub);margin-top:12px;}
.nd-mdelta{position:absolute;top:20px;right:22px;font-size:18px;font-weight:700;padding:2px 10px;border-radius:12px;}
.nd-mdelta.up{color:#34d399;background:rgba(52,211,153,.15);}
.nd-mdelta.down{color:#f87171;background:rgba(248,113,113,.15);}
.nd-bullets{list-style:none;text-align:left;max-width:900px;}
.nd-bullets li{font-size:28px;line-height:1.5;margin:18px 0;padding-left:44px;position:relative;}
.nd-bullets li::before{content:"";position:absolute;left:8px;top:14px;width:16px;height:16px;border-radius:50%;background:var(--nd-gold);box-shadow:0 0 12px var(--nd-gold);}
#nd-progress{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:30;}
#nd-progress .nd-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.3s;}
#nd-progress .nd-dot.on{background:var(--nd-gold);width:34px;border-radius:6px;}
.nd-compare{display:flex;align-items:stretch;width:100%;max-width:1000px;}
.nd-cmp-col{flex:1;background:var(--nd-card);border:1px solid var(--nd-line);padding:26px 30px;}
.nd-cmp-col.L{border-radius:18px 0 0 18px;}
.nd-cmp-col.R{border-radius:0 18px 18px 0;border-left:none;}
.nd-cmp-h{font-size:26px;font-weight:700;color:var(--nd-gold);margin-bottom:16px;}
.nd-cmp-col ul{list-style:none;text-align:left;}
.nd-cmp-col li{font-size:21px;line-height:1.5;margin:12px 0;padding-left:26px;position:relative;color:var(--nd-ink);}
.nd-cmp-col li::before{content:"›";position:absolute;left:6px;color:var(--nd-gold);font-weight:bold;}
.nd-cmp-vs{display:flex;align-items:center;justify-content:center;width:56px;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--nd-blue),var(--nd-gold));}
.nd-timeline{display:flex;justify-content:space-between;width:100%;max-width:1050px;position:relative;padding-top:20px;}
.nd-timeline::before{content:"";position:absolute;top:32px;left:5%;right:5%;height:3px;background:var(--nd-line);}
.nd-tl-node{flex:1;text-align:center;position:relative;}
.nd-tl-dot{width:22px;height:22px;border-radius:50%;background:var(--nd-gold);margin:0 auto 14px;box-shadow:0 0 14px var(--nd-gold);position:relative;z-index:1;}
.nd-tl-t{font-size:20px;font-weight:700;color:var(--nd-gold);}
.nd-tl-c{font-size:17px;color:var(--nd-sub);margin-top:6px;padding:0 8px;line-height:1.4;}
.nd-quote{font-size:34px;line-height:1.5;font-style:italic;max-width:900px;color:#fff;position:relative;padding:20px 40px;}
.nd-quote cite{display:block;font-size:22px;color:var(--nd-sub);font-style:normal;margin-top:18px;}
.nd-chart-box{background:var(--nd-card);border:1px solid var(--nd-line);border-radius:18px;padding:24px;width:100%;max-width:820px;}
.nd-chart-t{font-size:24px;font-weight:700;margin-bottom:14px;color:var(--nd-ink);}
#nd-hint{position:fixed;bottom:20px;right:24px;font-size:13px;color:rgba(159,176,202,.6);z-index:30;}
@media(max-width:900px){.nd-hero h1{font-size:44px;}.nd-layout-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="nd-stage"></div>
<div id="nd-hint">左右键/空格翻页 · O 总览 · F11 全屏</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
// Deck数据
const DECK_DATA = {
  theme: {blue: "#38BDF8", gold: "#F59E0B", bg: "#0F172A"},
  slides: [
    {
      layout: "center",
      blocks: [
        {type: "hero", kick: "2026 Q3", title: "业务复盘", sub: "核心指标超预期，新业务线快速增长"}
      ]
    },
    {
      layout: "center",
      blocks: [
        {type: "hero", kick: "核心结论", title: "三项关键突破", sub: "营收增长 · 用户留存 · 产品矩阵"},
        {type: "metric", items: [
          {value: "125", unit: "M", label: "Q3营收", delta: "+25%", trend: "up"},
          {value: "78", unit: "%", label: "用户留存率", delta: "+12pp", trend: "up"},
          {value: "3", unit: "条", label: "新产品线", delta: "新增", trend: "up"}
        ]}
      ]
    },
    {
      layout: "center",
      blocks: [
        {type: "hero", kick: "数据支撑", title: "营收持续增长", sub: "Q3环比增长25%，同比增长40%"},
        {type: "chart", title: "2026年营收趋势（单位：百万元）", chartType: "line", data: {
          labels: ["Q1", "Q2", "Q3", "Q4（预测）"],
          datasets: [
            {label: "2026年实际", data: [80, 100, 125, 150], borderColor: "#38BDF8", backgroundColor: "rgba(56, 189, 248, 0.1)", tension: 0.4},
            {label: "2025年同期", data: [70, 78, 90, 95], borderColor: "#94A3B8", backgroundColor: "rgba(148, 163, 184, 0.1)", tension: 0.4, borderDash: [5, 5]}
          ]
        }}
      ]
    },
    {
      layout: "center",
      blocks: [
        {type: "hero", kick: "用户洞察", title: "留存率创新高", sub: "付费转化与续约率双提升"},
        {type: "compare", left: {title: "Q2表现", items: ["留存率：66%", "付费转化：8.2%", "续约率：72%"]},
         right: {title: "Q3突破", items: ["留存率：78% ↑12pp", "付费转化：11.5% ↑3.3pp", "续约率：85% ↑13pp"]}}
      ]
    },
    {
      layout: "center",
      blocks: [
        {type: "hero", kick: "产品布局", title: "新业务线快速起量", sub: "从单一产品到产品矩阵"},
        {type: "timeline", items: [
          {time: "Q1", text: "核心产品优化 - DAU破100万"},
          {time: "Q2", text: "企业版上线 - 签约15家头部客户"},
          {time: "Q3", text: "AI助手发布 - 贡献20%新增营收"},
          {time: "Q4", text: "国际化启动 - 目标东南亚3国"}
        ]}
      ]
    },
    {
      layout: "center",
      blocks: [
        {type: "hero", kick: "Q4行动", title: "三大战役", sub: "营收冲刺 · 产品打磨 · 组织升级"},
        {type: "bullets", title: "Q4关键举措", items: [
          "营收目标150M - 大客户深耕+渠道下沉双驱动",
          "AI助手2.0 - 性能优化+场景扩展，目标贡献35%营收",
          "组织扩编 - 技术团队扩招30人，销售团队建立3个区域中心"
        ], stagger: true}
      ]
    },
    {
      layout: "center",
      blocks: [
        {type: "quote", text: "Q3超预期，Q4全力冲刺年度目标200M", by: "战略运营部 · 2026.10"}
      ]
    }
  ]
};

// 引擎
const ND = {
  deck: null, cur: 0, frag: 0, root: null,
  init(deck) {
    this.deck = deck; this.root = document.getElementById("nd-stage");
    if (deck.theme) {
      const t = deck.theme, rs = document.documentElement.style;
      if (t.blue) rs.setProperty("--nd-blue", t.blue);
      if (t.gold) rs.setProperty("--nd-gold", t.gold);
      if (t.bg) rs.setProperty("--nd-bg", t.bg);
    }
    this.render(); this.buildProgress(); this.bindKeys();
  },
  render() {
    const s = this.deck.slides[this.cur]; this.frag = 0; this.root.innerHTML = "";
    const slide = document.createElement("section");
    slide.className = "nd-slide nd-layout-" + (s.layout || "center");
    (s.blocks || []).forEach((b, bi) => {
      const el = Blocks.render(b, bi);
      if (el) slide.appendChild(el);
    });
    this.root.appendChild(slide);
    this._enter(slide); this.updateProgress();
  },
  _enter(slide) {
    const items = slide.querySelectorAll(".nd-block");
    if (window.gsap) {
      gsap.from(items, {y: 28, opacity: 0, duration: .6, stagger: .08, ease: "power2.out"});
    }
  },
  _frags() {return Array.prototype.slice.call(this.root.querySelectorAll("[data-frag]"));},
  next() {
    const fr = this._frags();
    if (this.frag < fr.length) {
      const el = fr[this.frag]; el.classList.add("nd-show");
      if (window.gsap) gsap.from(el, {y: 16, opacity: 0, duration: .4, ease: "power2.out"});
      this.frag++; return;
    }
    if (this.cur < this.deck.slides.length - 1) {this.cur++; this.render();}
  },
  prev() {
    if (this.frag > 0) {
      this.frag--; const fr = this._frags();
      if (fr[this.frag]) fr[this.frag].classList.remove("nd-show");
      return;
    }
    if (this.cur > 0) {
      this.cur--; this.render();
      this.frag = this._frags().length;
      this._frags().forEach(e => e.classList.add("nd-show"));
    }
  },
  goto(i) {if (i >= 0 && i < this.deck.slides.length) {this.cur = i; this.render();}},
  bindKeys() {
    document.addEventListener("keydown", e => {
      const k = e.key;
      if (k === "ArrowRight" || k === "PageDown" || k === " ") {this.next(); e.preventDefault();}
      else if (k === "ArrowLeft" || k === "PageUp") {this.prev(); e.preventDefault();}
      else if (k === "Home") this.goto(0);
      else if (k === "End") this.goto(this.deck.slides.length - 1);
      else if (k.toLowerCase() === "o") this.toggleOverview();
    });
  },
  buildProgress() {
    let bar = document.getElementById("nd-progress");
    if (!bar) {bar = document.createElement("div"); bar.id = "nd-progress"; document.body.appendChild(bar);}
    bar.innerHTML = "";
    this.deck.slides.forEach((s, i) => {
      const d = document.createElement("div");
      d.className = "nd-dot";
      d.onclick = () => this.goto(i);
      bar.appendChild(d);
    });
  },
  updateProgress() {
    const dots = document.querySelectorAll("#nd-progress .nd-dot");
    dots.forEach((d, i) => d.classList.toggle("on", i === this.cur));
  },
  toggleOverview() {document.body.classList.toggle("nd-overview");}
};

// Block渲染器
const Blocks = {
  render(b, bi) {
    const wrap = document.createElement("div");
    wrap.className = "nd-block";
    if (b.frag) wrap.setAttribute("data-frag", "1");

    if (b.type === "hero") {
      wrap.className += " nd-hero-wrap";
      let html = "";
      if (b.kick) html += `<div class="nd-kick">${b.kick}</div>`;
      if (b.title) html += `<h1>${b.title}</h1>`;
      if (b.title || b.kick) html += `<div class="nd-goldline"></div>`;
      if (b.sub) html += `<div class="nd-sub">${b.sub}</div>`;
      wrap.innerHTML = html;
    }
    else if (b.type === "metric") {
      const cont = document.createElement("div");
      cont.className = "nd-metrics";
      (b.items || []).forEach(m => {
        const card = document.createElement("div");
        card.className = "nd-metric";
        card.innerHTML = `
          <div class="nd-mnum">${m.value}<span class="nd-munit">${m.unit || ""}</span></div>
          <div class="nd-mlabel">${m.label}</div>
          ${m.delta ? `<div class="nd-mdelta ${m.trend || ""}">${m.delta}</div>` : ""}
        `;
        cont.appendChild(card);
      });
      wrap.appendChild(cont);
    }
    else if (b.type === "bullets") {
      if (b.title) {const h = document.createElement("h2"); h.textContent = b.title; wrap.appendChild(h);}
      const ul = document.createElement("ul");
      ul.className = "nd-bullets";
      (b.items || []).forEach((it, i) => {
        const li = document.createElement("li");
        li.textContent = it;
        if (b.stagger) li.setAttribute("data-frag", "1");
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    }
    else if (b.type === "compare") {
      const comp = document.createElement("div");
      comp.className = "nd-compare";
      const L = b.left, R = b.right;
      comp.innerHTML = `
        <div class="nd-cmp-col L">
          <div class="nd-cmp-h">${L.title || ""}</div>
          <ul>${(L.items || []).map(x => `<li>${x}</li>`).join("")}</ul>
        </div>
        <div class="nd-cmp-vs">VS</div>
        <div class="nd-cmp-col R">
          <div class="nd-cmp-h">${R.title || ""}</div>
          <ul>${(R.items || []).map(x => `<li>${x}</li>`).join("")}</ul>
        </div>
      `;
      wrap.appendChild(comp);
    }
    else if (b.type === "timeline") {
      const tl = document.createElement("div");
      tl.className = "nd-timeline";
      (b.items || []).forEach(it => {
        const node = document.createElement("div");
        node.className = "nd-tl-node";
        node.innerHTML = `
          <div class="nd-tl-dot"></div>
          <div class="nd-tl-t">${it.time}</div>
          <div class="nd-tl-c">${it.text}</div>
        `;
        tl.appendChild(node);
      });
      wrap.appendChild(tl);
    }
    else if (b.type === "quote") {
      const q = document.createElement("blockquote");
      q.className = "nd-quote";
      q.innerHTML = `${b.text}${b.by ? `<cite>— ${b.by}</cite>` : ""}`;
      wrap.appendChild(q);
    }
    else if (b.type === "chart" && window.Chart) {
      const box = document.createElement("div");
      box.className = "nd-chart-box";
      if (b.title) {const t = document.createElement("div"); t.className = "nd-chart-t"; t.textContent = b.title; box.appendChild(t);}
      const canvas = document.createElement("canvas");
      box.appendChild(canvas);
      wrap.appendChild(box);

      setTimeout(() => {
        new Chart(canvas, {
          type: b.chartType || "bar",
          data: b.data,
          options: {
            responsive: true,
            plugins: {legend: {labels: {color: "#F8FAFC"}}},
            scales: {
              y: {ticks: {color: "#9FB0CA"}, grid: {color: "rgba(255,255,255,0.1)"}},
              x: {ticks: {color: "#9FB0CA"}, grid: {color: "rgba(255,255,255,0.1)"}}
            }
          }
        });
      }, 100);
    }

    return wrap;
  }
};

// 启动
window.addEventListener("DOMContentLoaded", () => ND.init(DECK_DATA));
</script>
</body>
</html>
