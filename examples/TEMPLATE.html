<head>

<title>IND 通用模板 - 自动路径解析</title>

<!-- 动态路径解析脚本 - 无需硬编码，自动适配不同用户环境 -->
<script>
(function() {
  // 方案1：检测当前页面路径，自动推断skill引擎路径
  const currentUrl = window.location.href;

  // 提取用户主目录（兼容Windows/Unix）
  const homeMatch = currentUrl.match(/file:\/\/\/([A-Z]:\/Users\/[^\/]+|home\/[^\/]+)/);
  const homeDir = homeMatch ? homeMatch[1].replace('file:///', '') : '';

  let skillPath = '';

  if (homeDir) {
    // Windows: C:/Users/xxx/.claude/skills/...
    // Unix: /home/xxx/.claude/skills/...
    if (homeDir.includes(':')) {
      skillPath = homeDir + '/.claude/skills/interactive-narrative-deck/engine/';
    } else {
      skillPath = '/' + homeDir + '/.claude/skills/interactive-narrative-deck/engine/';
    }
  } else {
    // 回退方案：假设HTML在examples下，相对路径
    skillPath = '../engine/';
  }

  // 加载CSS
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = skillPath + 'style.css';
  document.head.appendChild(link);

  // 保存路径供JS使用
  window.IND_SKILL_PATH = skillPath;

  console.log('[IND] 自动解析skill路径:', skillPath);
})();
</script>
</head>
<body>
<div id="nd-stage"></div>

<!-- CDN依赖 -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<!-- 动态加载skill引擎 -->
<script>
(function() {
  const basePath = window.IND_SKILL_PATH;
  const scripts = [
    'block-registry.js',
    'business-blocks.js',
    'core-blocks.js',
    'engine.js'
  ];

  let loaded = 0;
  scripts.forEach(src => {
    const script = document.createElement('script');
    script.src = basePath + src;
    script.onload = () => {
      loaded++;
      if (loaded === scripts.length) {
        console.log('[IND] 引擎加载完成，初始化Deck...');
        initDeck();
      }
    };
    script.onerror = () => {
      console.error('[IND] 加载失败:', basePath + src);
    };
    document.head.appendChild(script);
  });
})();
