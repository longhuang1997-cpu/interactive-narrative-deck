<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Deck - 可视化配置工具</title>
<style>
:root{--primary:#2563eb;--secondary:#f59e0b;--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f8fafc;--sub:#94a3b8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;line-height:1.6;}
.container{max-width:1200px;margin:0 auto;}
h1{font-size:32px;margin-bottom:24px;background:linear-gradient(120deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;}
.section h2{font-size:22px;margin-bottom:16px;color:var(--secondary);}
.form-group{margin-bottom:20px;}
.form-group label{display:block;margin-bottom:8px;font-size:14px;color:var(--sub);}
.form-group input[type="text"],.form-group input[type="color"],.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;}
.form-group input[type="color"]{height:42px;cursor:pointer;}
.form-group textarea{min-height:100px;resize:vertical;}
.color-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
.color-item{display:flex;align-items:center;gap:12px;}
.color-preview{width:40px;height:40px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;}
.btn-group{display:flex;gap:12px;margin-top:24px;}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:#1d4ed8;transform:translateY(-2px);}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--primary);transform:translateY(-2px);}
.preview-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:16px;min-height:150px;}
.preview-slide{background:radial-gradient(ellipse at 20% 0%,rgba(37,99,235,.18),transparent 55%),var(--bg);border-radius:8px;padding:40px;text-align:center;color:var(--text);}
.preview-title{font-size:48px;font-weight:800;margin-bottom:16px;}
.preview-sub{font-size:18px;color:var(--sub);}
.help-text{font-size:13px;color:var(--sub);margin-top:6px;font-style:italic;}
.output-code{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:16px;font-family:"Consolas","Courier New",monospace;font-size:13px;color:#94a3b8;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;}
.copy-btn{position:absolute;top:20px;right:20px;padding:6px 12px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;}
.copy-btn:hover{background:#1d4ed8;}
.relative{position:relative;}
</style>
</head>
<body>
<div class="container">
  <h1>🎨 Interactive Deck - 可视化配置工具</h1>
  <p style="color:var(--sub);margin-bottom:32px;">调整主题配色、叙事框架、视觉风格，实时预览并生成配置代码。</p>

  <!-- 主题配色 -->
  <div class="section">
    <h2>🎨 主题配色</h2>
    <div class="color-grid">
      <div class="color-item">
        <div class="color-preview" id="preview-primary" style="background:#2563eb;"></div>
        <div style="flex:1;">
          <label>主色调（Primary）</label>
          <input type="color" id="color-primary" value="#2563eb">
        </div>
      </div>
      <div class="color-item">
        <div class="color-preview" id="preview-secondary" style="background:#f59e0b;"></div>
        <div style="flex:1;">
          <label>辅助色（Secondary）</label>
          <input type="color" id="color-secondary" value="#f59e0b">
        </div>
      </div>
      <div class="color-item">
        <div class="color-preview" id="preview-bg" style="background:#0f172a;"></div>
        <div style="flex:1;">
          <label>背景色（Background）</label>
          <input type="color" id="color-bg" value="#0f172a">
        </div>
      </div>
    </div>
    <p class="help-text">💡 建议：主色用于数据强调，辅助色用于行动号召，背景建议深色（专业感）</p>
  </div>

  <!-- 叙事框架 -->
  <div class="section">
    <h2>📖 叙事框架选择</h2>
    <div class="form-group">
      <label>受众类型</label>
      <select id="narrative-audience">
        <option value="executive">高管/董事会（结论先行）</option>
        <option value="customer">客户/投资人（价值主张优先）</option>
        <option value="team">团队/管理层（OKR进展汇报）</option>
        <option value="launch">产品发布（产品叙事）</option>
        <option value="problem">问题分析（问题-方案架构）</option>
      </select>
      <p class="help-text">💡 AI会根据受众自动匹配对应的叙事框架和页面结构</p>
    </div>
    <div class="form-group">
      <label>汇报时长（分钟）</label>
      <select id="duration">
        <option value="5">5分钟（5-6页）</option>
        <option value="10" selected>10分钟（8-10页）</option>
        <option value="15">15分钟（12-15页）</option>
        <option value="30">30分钟（20-25页）</option>
      </select>
    </div>
  </div>

  <!-- 视觉风格 -->
  <div class="section">
    <h2>✨ 视觉风格</h2>
    <div class="form-group">
      <label>标题字号（px）</label>
      <input type="text" id="font-title" value="72" placeholder="72-96">
      <p class="help-text">推荐：72-96px，确保远距离可读</p>
    </div>
    <div class="form-group">
      <label>正文字号（px）</label>
      <input type="text" id="font-body" value="24" placeholder="24-28">
      <p class="help-text">推荐：24-28px，平衡可读性与信息密度</p>
    </div>
    <div class="form-group">
      <label>动效速度</label>
      <select id="animation-speed">
        <option value="fast">快速（0.3s）</option>
        <option value="normal" selected>正常（0.6s）</option>
        <option value="slow">缓慢（1.0s）</option>
      </select>
    </div>
  </div>

  <!-- 实时预览 -->
  <div class="section">
    <h2>👁️ 实时预览</h2>
    <div class="preview-box">
      <div class="preview-slide" id="preview-slide">
        <div class="preview-title" id="preview-title-text">战略汇报演示</div>
        <div style="width:120px;height:6px;border-radius:3px;margin:20px auto;background:linear-gradient(90deg,#f59e0b,transparent);" id="preview-line"></div>
        <div class="preview-sub">Interactive Narrative Deck v3.0</div>
      </div>
    </div>
  </div>

  <!-- 生成配置代码 -->
  <div class="section relative">
    <h2>📋 配置代码</h2>
    <button class="copy-btn" onclick="copyCode()">复制</button>
    <p style="color:var(--sub);margin-bottom:12px;">将以下代码复制到你的 deck.js 的 theme 配置中：</p>
    <div class="output-code" id="output-code">// 生成中...</div>
  </div>

  <!-- 操作按钮 -->
  <div class="btn-group">
    <button class="btn btn-primary" onclick="generateConfig()">🎨 生成配置</button>
    <button class="btn btn-secondary" onclick="resetDefaults()">🔄 恢复默认</button>
    <button class="btn btn-secondary" onclick="exportJSON()">📦 导出JSON</button>
  </div>
</div>

<script>
// 实时预览更新
document.querySelectorAll('input[type="color"]').forEach(input => {
  input.addEventListener('input', updatePreview);
});

document.querySelectorAll('input[type="text"], select').forEach(input => {
  input.addEventListener('change', updatePreview);
});

function updatePreview() {
  const primary = document.getElementById('color-primary').value;
  const secondary = document.getElementById('color-secondary').value;
  const bg = document.getElementById('color-bg').value;
  const titleSize = document.getElementById('font-title').value;

  document.getElementById('preview-primary').style.background = primary;
  document.getElementById('preview-secondary').style.background = secondary;
  document.getElementById('preview-bg').style.background = bg;

  const slide = document.getElementById('preview-slide');
  slide.style.background = `radial-gradient(ellipse at 20% 0%, ${primary}30, transparent 55%), ${bg}`;

  const title = document.getElementById('preview-title-text');
  title.style.fontSize = titleSize + 'px';

  const line = document.getElementById('preview-line');
  line.style.background = `linear-gradient(90deg, ${secondary}, transparent)`;

  generateConfig();
}

function generateConfig() {
  const config = {
    theme: {
      primary: document.getElementById('color-primary').value,
      secondary: document.getElementById('color-secondary').value,
      bg: document.getElementById('color-bg').value,
      text: '#f8fafc',
      sub: '#94a3b8'
    },
    narrative: {
      audience: document.getElementById('narrative-audience').value,
      duration: parseInt(document.getElementById('duration').value)
    },
    visual: {
      fontSize: {
        title: parseInt(document.getElementById('font-title').value),
        body: parseInt(document.getElementById('font-body').value)
      },
      animation: document.getElementById('animation-speed').value
    }
  };

  const code = `theme: ${JSON.stringify(config.theme, null, 2)},\n\nmeta: {\n  audience: "${config.narrative.audience}",\n  duration: ${config.narrative.duration},\n  fontSize: ${JSON.stringify(config.visual.fontSize, null, 2)},\n  animationSpeed: "${config.visual.animation}"\n}`;

  document.getElementById('output-code').textContent = code;
}

function copyCode() {
  const code = document.getElementById('output-code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = '复制', 2000);
  });
}

function resetDefaults() {
  document.getElementById('color-primary').value = '#2563eb';
  document.getElementById('color-secondary').value = '#f59e0b';
  document.getElementById('color-bg').value = '#0f172a';
  document.getElementById('font-title').value = '72';
  document.getElementById('font-body').value = '24';
  document.getElementById('narrative-audience').value = 'executive';
  document.getElementById('duration').value = '10';
  document.getElementById('animation-speed').value = 'normal';
  updatePreview();
}

function exportJSON() {
  const config = {
    theme: {
      primary: document.getElementById('color-primary').value,
      secondary: document.getElementById('color-secondary').value,
      bg: document.getElementById('color-bg').value
    },
    narrative: {
      audience: document.getElementById('narrative-audience').value,
      duration: parseInt(document.getElementById('duration').value)
    },
    visual: {
      fontSize: {
        title: parseInt(document.getElementById('font-title').value),
        body: parseInt(document.getElementById('font-body').value)
      },
      animation: document.getElementById('animation-speed').value
    }
  };

  const blob = new Blob([JSON.stringify(config, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'deck-config.json';
  a.click();
}

// 初始化
updatePreview();
</script>
</body>
</html>
