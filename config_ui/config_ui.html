<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Interactive Narrative Deck · 画布编排</title>
<style>
:root{
  --blue:#2563eb;--gold:#e8c874;--gold2:#f59e0b;
  --bg:#080e1c;--panel:#0d1526;--card:#141f35;--border:#1e2d45;
  --sub:#9fb0ca;--ink:#eaf0fb;--green:#34d399;--red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── 顶部工具栏 ── */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;}
.topbar h1{font-size:15px;color:var(--gold);font-weight:700;margin-right:8px;}
.tb-sep{width:1px;height:24px;background:var(--border);}
.tb-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.tb-btn:hover{border-color:var(--blue);color:#fff;}
.tb-btn.primary{background:linear-gradient(135deg,var(--blue),#1e40af);border-color:transparent;color:#fff;}
.tb-btn.danger{border-color:#c0392b;color:#f87171;}
.tb-btn.active{border-color:var(--gold);color:var(--gold);}
.tb-spacer{flex:1;}
.tb-label{font-size:12px;color:var(--sub);}

/* ── 主体三栏布局 ── */
.workspace{display:flex;flex:1;overflow:hidden;}

/* 左：页面管理 */
.slides-panel{width:160px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.slides-panel .sp-header{padding:10px 12px;font-size:11px;color:var(--gold);letter-spacing:.08em;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sp-add{background:none;border:none;color:var(--gold);cursor:pointer;font-size:18px;line-height:1;}
.slides-list{flex:1;overflow-y:auto;padding:8px 8px;}
.slide-thumb{background:var(--card);border:1.5px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:.15s;overflow:hidden;}
.slide-thumb:hover{border-color:var(--blue);}
.slide-thumb.active{border-color:var(--gold);}
.slide-thumb .thumb-preview{height:70px;background:#0b1220;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);position:relative;overflow:hidden;}
.slide-thumb .thumb-label{padding:4px 6px;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slide-thumb .thumb-num{position:absolute;top:3px;left:4px;font-size:9px;color:rgba(255,255,255,.4);}
.slide-thumb .thumb-del{position:absolute;top:3px;right:4px;background:rgba(248,113,113,.2);border:none;color:#f87171;border-radius:3px;font-size:9px;cursor:pointer;padding:1px 4px;display:none;}
.slide-thumb:hover .thumb-del{display:block;}

/* 中：画布区 */
.canvas-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#060c18;}
.canvas-toolbar{padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.canvas-toolbar .ct-label{font-size:12px;color:var(--sub);}
.layout-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:12px;cursor:pointer;font-family:inherit;}
.layout-btn:hover{border-color:var(--blue);color:#fff;}
.layout-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(232,200,116,.08);}
.canvas-frame{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:20px;}
iframe#canvas-preview{width:100%;height:100%;border:none;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,.6);}

/* 右：属性面板 */
.props-panel{width:280px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.pp-tabs{display:flex;border-bottom:1px solid var(--border);}
.pp-tab{flex:1;padding:10px 0;font-size:12px;color:var(--sub);cursor:pointer;text-align:center;border-bottom:2px solid transparent;transition:.15s;}
.pp-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.pp-body{flex:1;overflow-y:auto;padding:12px;}

/* Block库 */
.block-library{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.block-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 8px;cursor:pointer;text-align:center;transition:.15s;}
.block-item:hover{border-color:var(--blue);transform:translateY(-1px);}
.block-item .bi-icon{font-size:20px;margin-bottom:4px;}
.block-item .bi-name{font-size:11px;color:var(--sub);}

/* 当前页Block列表 */
.block-list{display:flex;flex-direction:column;gap:6px;}
.block-row{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:.15s;}
.block-row:hover{border-color:var(--blue);}
.block-row.selected{border-color:var(--gold);background:rgba(232,200,116,.05);}
.br-icon{font-size:14px;width:20px;text-align:center;}
.br-label{flex:1;font-size:12px;color:var(--ink);}
.br-del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px;padding:0 2px;}
.br-del:hover{color:#f87171;}
.br-up,.br-dn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:11px;padding:0 2px;}
.br-up:hover,.br-dn:hover{color:var(--gold);}

/* 属性编辑器 */
.prop-section{margin-bottom:16px;}
.prop-section h3{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase;}
.prop-row{margin-bottom:8px;}
.prop-row label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px;}
.prop-row input,.prop-row select,.prop-row textarea{width:100%;background:#0a0f1e;border:1px solid var(--border);border-radius:5px;color:var(--ink);font-size:12px;padding:6px 8px;font-family:inherit;outline:none;}
.prop-row input:focus,.prop-row select:focus,.prop-row textarea:focus{border-color:var(--blue);}
.prop-row textarea{resize:vertical;min-height:60px;line-height:1.5;}
.color-row{display:flex;gap:6px;align-items:center;}
.color-swatch{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;}
.theme-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.theme-preset{width:28px;height:28px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:.15s;}
.theme-preset:hover,.theme-preset.active{border-color:var(--gold);}
.add-item-btn{width:100%;padding:6px;background:rgba(37,99,235,.15);border:1px dashed var(--border);border-radius:5px;color:var(--sub);font-size:12px;cursor:pointer;font-family:inherit;margin-top:4px;}
.add-item-btn:hover{border-color:var(--blue);color:#fff;}
.items-list{display:flex;flex-direction:column;gap:4px;}
.item-row{display:flex;gap:4px;align-items:center;}
.item-row input{flex:1;}
.item-del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px;flex-shrink:0;}
.item-del:hover{color:#f87171;}

/* 图表数据编辑器 */
.chart-data-editor{background:#0a0f1e;border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:6px;}
.chart-data-editor table{width:100%;border-collapse:collapse;font-size:11px;}
.chart-data-editor th{color:var(--sub);padding:3px 4px;border-bottom:1px solid var(--border);}
.chart-data-editor td{padding:2px 2px;}
.chart-data-editor td input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--ink);font-size:11px;width:100%;padding:2px 3px;font-family:inherit;}
.chart-data-editor td input:focus{border-bottom-color:var(--blue);outline:none;}

/* 主题面板 */
.theme-section .color-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* 底部状态栏 */
.statusbar{height:26px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px;color:var(--sub);flex-shrink:0;}

/* 动效选择 */
.anim-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.anim-opt{padding:6px 8px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-size:11px;color:var(--sub);text-align:center;transition:.15s;}
.anim-opt:hover{border-color:var(--blue);color:#fff;}
.anim-opt.active{border-color:var(--gold);color:var(--gold);background:rgba(232,200,116,.08);}
</style>
</head>
<body>

<!-- 顶部工具栏 -->
<div class="topbar">
  <h1>🎯 Narrative Deck · 画布编排</h1>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="addSlide()">＋ 新增页</button>
  <button class="tb-btn" onclick="duplicateSlide()">⎘ 复制页</button>
  <button class="tb-btn danger" onclick="deleteSlide()">✕ 删除页</button>
  <div class="tb-sep"></div>
  <span class="tb-label">主题:</span>
  <div class="theme-presets" style="margin:0;">
    <div class="theme-preset active" style="background:linear-gradient(135deg,#2563eb,#e8c874)" title="深蓝专业" onclick="setTheme('dark-blue',this)"></div>
    <div class="theme-preset" style="background:linear-gradient(135deg,#0ea5e9,#f59e0b)" title="科技蓝" onclick="setTheme('tech',this)"></div>
    <div class="theme-preset" style="background:linear-gradient(135deg,#7c3aed,#f0abfc)" title="深紫优雅" onclick="setTheme('elegant',this)"></div>
    <div class="theme-preset" style="background:linear-gradient(135deg,#1d4ed8,#fcd34d)" title="琥珀暖调" onclick="setTheme('warm',this)"></div>
  </div>
  <div class="tb-spacer"></div>
  <button class="tb-btn" onclick="exportConfig()">📦 导出 config.json</button>
  <button class="tb-btn primary" onclick="exportDeck()">🚀 生成 deck.js</button>
</div>

<div class="workspace">

  <!-- 左：页面列表 -->
  <div class="slides-panel">
    <div class="sp-header">
      <span>页面列表</span>
      <button class="sp-add" onclick="addSlide()" title="新增页">＋</button>
    </div>
    <div class="slides-list" id="slides-list"></div>
  </div>

  <!-- 中：画布 -->
  <div class="canvas-area">
    <div class="canvas-toolbar">
      <span class="ct-label">布局:</span>
      <button class="layout-btn active" onclick="setLayout('center',this)">居中</button>
      <button class="layout-btn" onclick="setLayout('left',this)">左对齐</button>
      <button class="layout-btn" onclick="setLayout('grid',this)">双列</button>
      <button class="layout-btn" onclick="setLayout('scroll',this)">滚动</button>
      <div style="flex:1"></div>
      <span class="ct-label" id="slide-info">第1页 / 共1页</span>
    </div>
    <div class="canvas-frame">
      <iframe id="canvas-preview"></iframe>
    </div>
  </div>

  <!-- 右：属性面板 -->
  <div class="props-panel">
    <div class="pp-tabs">
      <div class="pp-tab active" onclick="switchTab('blocks',this)">Block库</div>
      <div class="pp-tab" onclick="switchTab('props',this)">属性</div>
      <div class="pp-tab" onclick="switchTab('anim',this)">动效</div>
    </div>
    <div class="pp-body" id="pp-body"></div>
  </div>
</div>

<div class="statusbar">
  <span id="status-blocks">0 个Block</span>
  <span>|</span>
  <span id="status-layout">layout: center</span>
  <span>|</span>
  <span id="status-theme">主题: 深蓝专业</span>
  <span style="flex:1"></span>
  <span style="color:#34d399">✓ 实时渲染</span>
</div>

<script>
// ── 数据模型 ──
const THEMES = {
  'dark-blue':{blue:'#2563eb',gold:'#e8c874',bg:'#0b1220',name:'深蓝专业'},
  'tech':     {blue:'#0ea5e9',gold:'#f59e0b',bg:'#0f172a',name:'科技蓝'},
  'elegant':  {blue:'#7c3aed',gold:'#f0abfc',bg:'#0d0d1a',name:'深紫优雅'},
  'warm':     {blue:'#d97706',gold:'#fcd34d',bg:'#1a1208',name:'琥珀暖调'},
};
const BLOCK_DEFS = [
  {type:'hero',    icon:'🏷️', name:'封面标题'},
  {type:'metric',  icon:'📊', name:'指标卡'},
  {type:'bullets', icon:'📋', name:'要点列表'},
  {type:'compare', icon:'⚖️', name:'左右对比'},
  {type:'timeline',icon:'🗓️', name:'时间线'},
  {type:'chart',   icon:'📈', name:'图表'},
  {type:'quote',   icon:'💬', name:'金句'},
  {type:'tabs',    icon:'📑', name:'标签页'},
  {type:'media',   icon:'🖼️', name:'图片/视频'},
  {type:'swot',    icon:'🎯', name:'SWOT矩阵'},
];

let state = {
  themeKey: 'dark-blue',
  slides: [{ id:1, title:'封面', layout:'center', blocks:[] }],
  curSlide: 0,
  curBlock: -1,
  curTab: 'blocks',
};

function mkId(){ return Date.now() + Math.random().toString(36).slice(2,6); }

// ── 默认Block数据 ──
function defaultBlock(type){
  switch(type){
    case 'hero':    return {id:mkId(),type:'hero',kick:'章节标签',title:'主标题',sub:'副标题说明',frag:false};
    case 'metric':  return {id:mkId(),type:'metric',items:[{value:'128.5',unit:'万',label:'营收',delta:'+23%'},{value:'92',unit:'%',label:'续约率',delta:'+5%'}]};
    case 'bullets': return {id:mkId(),type:'bullets',title:'核心要点',items:['要点一：说明','要点二：说明','要点三：说明'],stagger:true,frag:false};
    case 'compare': return {id:mkId(),type:'compare',left:{title:'方案A',items:['优点一','优点二']},right:{title:'方案B',items:['优点一','优点二']},frag:false};
    case 'timeline':return {id:mkId(),type:'timeline',items:[{time:'Q1',text:'启动'},{time:'Q2',text:'推进'},{time:'Q3',text:'收尾'}],frag:false};
    case 'quote':   return {id:mkId(),type:'quote',text:'效率不是做得更快，而是做对的事。',by:'—— 来源',frag:false};
    case 'chart':   return {id:mkId(),type:'chart',chart:'bar',title:'数据图表',labels:['Q1','Q2','Q3','Q4'],datasets:[{label:'本年',data:[95,105,128,145],color:'#e8c874'}],frag:false};
    case 'tabs':    return {id:mkId(),type:'tabs',tabs:[{label:'视角A',text:'内容A'},{label:'视角B',text:'内容B'}],frag:false};
    case 'media':   return {id:mkId(),type:'media',img:'',alt:'图片说明',frag:false};
    case 'swot':    return {id:mkId(),type:'swot',title:'SWOT分析',S:['优势1','优势2','优势3','优势4'],W:['劣势1','劣势2','劣势3','劣势4'],O:['机会1','机会2','机会3','机会4'],T:['威胁1','威胁2','威胁3','威胁4'],frag:false};
    default:        return {id:mkId(),type,frag:false};
  }
}

// ── 渲染左侧缩略图 ──
function renderSlidesList(){
  const list = document.getElementById('slides-list');
  list.innerHTML = '';
  state.slides.forEach((sl,i)=>{
    const div = document.createElement('div');
    div.className = 'slide-thumb' + (i===state.curSlide?' active':'');
    div.innerHTML = `
      <div class="thumb-preview">
        <span class="thumb-num">${i+1}</span>
        <button class="thumb-del" onclick="deleteSlideAt(${i},event)">✕</button>
        <span style="font-size:9px;color:#9fb0ca;padding:4px;text-align:center">${sl.title||'第'+(i+1)+'页'}<br><span style="opacity:.6">${sl.blocks.length}个block</span></span>
      </div>
      <div class="thumb-label">${sl.title||'第'+(i+1)+'页'}</div>`;
    div.onclick = ()=>{ state.curSlide=i; state.curBlock=-1; refresh(); };
    list.appendChild(div);
  });
  document.getElementById('slide-info').textContent = `第${state.curSlide+1}页 / 共${state.slides.length}页`;
}

// ── 切换布局 ──
function setLayout(layout, btn){
  state.slides[state.curSlide].layout = layout;
  document.querySelectorAll('.layout-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('status-layout').textContent = 'layout: '+layout;
  renderPreview();
}

// ── 切换主题 ──
function setTheme(key, el){
  state.themeKey = key;
  document.querySelectorAll('.theme-preset').forEach(e=>e.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('status-theme').textContent = '主题: '+THEMES[key].name;
  renderPreview();
}

// ── 右侧面板 ──
function switchTab(tab, el){
  state.curTab = tab;
  document.querySelectorAll('.pp-tab').forEach(e=>e.classList.remove('active'));
  if(el) el.classList.add('active');
  renderPropsPanel();
}

function renderPropsPanel(){
  const body = document.getElementById('pp-body');
  if(state.curTab==='blocks') body.innerHTML = renderBlockLibrary();
  else if(state.curTab==='props') body.innerHTML = renderPropsEditor();
  else if(state.curTab==='anim') body.innerHTML = renderAnimPanel();
}

function renderBlockLibrary(){
  const sl = state.slides[state.curSlide];
  let html = `<div class="prop-section"><h3>点击添加 Block</h3><div class="block-library">`;
  BLOCK_DEFS.forEach(def=>{
    html += `<div class="block-item" onclick="addBlock('${def.type}')">
      <div class="bi-icon">${def.icon}</div>
      <div class="bi-name">${def.name}</div>
    </div>`;
  });
  html += `</div></div>`;
  html += `<div class="prop-section"><h3>当前页 Blocks</h3><div class="block-list" id="block-list">`;
  if(!sl.blocks.length) html += `<div style="font-size:12px;color:var(--sub);text-align:center;padding:16px">点击上方添加Block</div>`;
  sl.blocks.forEach((b,i)=>{
    const def = BLOCK_DEFS.find(d=>d.type===b.type)||{icon:'📦',name:b.type};
    html += `<div class="block-row${state.curBlock===i?' selected':''}" onclick="selectBlock(${i})">
      <span class="br-icon">${def.icon}</span>
      <span class="br-label">${def.name}${b.title?' · '+b.title:''}</span>
      <button class="br-up" onclick="moveBlock(${i},-1,event)" title="上移">↑</button>
      <button class="br-dn" onclick="moveBlock(${i},1,event)" title="下移">↓</button>
      <button class="br-del" onclick="removeBlock(${i},event)" title="删除">✕</button>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

function renderPropsEditor(){
  if(state.curBlock<0) return `<div style="font-size:12px;color:var(--sub);text-align:center;padding:24px">在左侧Block库选中一个Block<br>这里会显示其属性</div>`;
  const b = state.slides[state.curSlide].blocks[state.curBlock];
  if(!b) return '';
  let html = `<div class="prop-section"><h3>${b.type} 属性</h3>`;

  if(b.type==='hero'){
    html += field('小标签 kick','kick',b.kick,'text') + field('主标题 title','title',b.title,'text') + field('副标题 sub','sub',b.sub,'text');
  } else if(b.type==='metric'){
    html += `<div class="prop-row"><label>指标项（每行一个，格式：数值|单位|标签|变化）</label>`;
    html += `<div class="items-list" id="metric-items">`;
    b.items.forEach((m,i)=>{
      html += `<div class="item-row">
        <input value="${m.value||''}" placeholder="数值" oninput="updateMetricItem(${i},'value',this.value)" style="width:50px">
        <input value="${m.unit||''}" placeholder="单位" oninput="updateMetricItem(${i},'unit',this.value)" style="width:36px">
        <input value="${m.label||''}" placeholder="标签" oninput="updateMetricItem(${i},'label',this.value)">
        <input value="${m.delta||''}" placeholder="变化" oninput="updateMetricItem(${i},'delta',this.value)" style="width:50px">
        <button class="item-del" onclick="removeMetricItem(${i})">✕</button>
      </div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addMetricItem()">＋ 添加指标</button></div>`;
  } else if(b.type==='bullets'){
    html += field('标题','title',b.title,'text');
    html += `<div class="prop-row"><label>要点列表</label><div class="items-list">`;
    b.items.forEach((item,i)=>{
      html += `<div class="item-row"><input value="${item}" oninput="updateItem('items',${i},this.value)"><button class="item-del" onclick="removeItem('items',${i})">✕</button></div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addItem('items','新要点')">＋ 添加要点</button></div>`;
    html += checkField('逐条渐进 stagger','stagger',b.stagger);
  } else if(b.type==='compare'){
    html += `<div class="prop-row"><label>左侧标题</label><input value="${b.left.title||''}" oninput="updateNested('left','title',this.value)"></div>`;
    html += `<div class="prop-row"><label>左侧要点</label><div class="items-list">`;
    (b.left.items||[]).forEach((item,i)=>{
      html += `<div class="item-row"><input value="${item}" oninput="updateNestedItem('left',${i},this.value)"><button class="item-del" onclick="removeNestedItem('left',${i})">✕</button></div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addNestedItem('left','新要点')">＋</button></div>`;
    html += `<div class="prop-row"><label>右侧标题</label><input value="${b.right.title||''}" oninput="updateNested('right','title',this.value)"></div>`;
    html += `<div class="prop-row"><label>右侧要点</label><div class="items-list">`;
    (b.right.items||[]).forEach((item,i)=>{
      html += `<div class="item-row"><input value="${item}" oninput="updateNestedItem('right',${i},this.value)"><button class="item-del" onclick="removeNestedItem('right',${i})">✕</button></div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addNestedItem('right','新要点')">＋</button></div>`;
  } else if(b.type==='timeline'){
    html += `<div class="prop-row"><label>节点（时间|说明）</label><div class="items-list">`;
    b.items.forEach((item,i)=>{
      html += `<div class="item-row">
        <input value="${item.time||''}" placeholder="时间" style="width:60px" oninput="updateTimelineItem(${i},'time',this.value)">
        <input value="${item.text||''}" placeholder="说明" oninput="updateTimelineItem(${i},'text',this.value)">
        <button class="item-del" onclick="removeTimelineItem(${i})">✕</button>
      </div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addTimelineItem()">＋ 添加节点</button></div>`;
  } else if(b.type==='quote'){
    html += field('引用文字','text',b.text,'textarea') + field('出处 by','by',b.by,'text');
  } else if(b.type==='chart'){
    html += `<div class="prop-row"><label>图表类型</label><select onchange="updateProp('chart',this.value)">
      ${['bar','line','pie','doughnut'].map(t=>`<option value="${t}"${b.chart===t?' selected':''}>${{bar:'柱状图',line:'折线图',pie:'饼图',doughnut:'环形图'}[t]}</option>`).join('')}
    </select></div>`;
    html += field('图表标题','title',b.title,'text');
    html += `<div class="prop-row"><label>数据标签（逗号分隔）</label><input value="${(b.labels||[]).join(',')}" oninput="updateLabels(this.value)"></div>`;
    html += `<div class="prop-row"><label>数据系列</label>`;
    (b.datasets||[]).forEach((ds,i)=>{
      html += `<div style="background:#0a0f1e;border:1px solid var(--border);border-radius:5px;padding:6px;margin-bottom:6px">
        <div class="item-row" style="margin-bottom:4px">
          <input value="${ds.label||''}" placeholder="系列名" oninput="updateDataset(${i},'label',this.value)">
          <input type="color" value="${ds.color||'#e8c874'}" oninput="updateDataset(${i},'color',this.value)" style="width:32px;padding:1px;border-radius:3px;background:transparent;border:1px solid var(--border)">
          <button class="item-del" onclick="removeDataset(${i})">✕</button>
        </div>
        <input value="${(ds.data||[]).join(',')}" placeholder="数据（逗号分隔）" oninput="updateDataset(${i},'data',this.value)" style="width:100%;background:#080e1c;border:1px solid var(--border);border-radius:4px;color:var(--ink);font-size:11px;padding:4px 6px;font-family:inherit">
      </div>`;
    });
    html += `<button class="add-item-btn" onclick="addDataset()">＋ 添加系列</button></div>`;
  } else if(b.type==='tabs'){
    html += `<div class="prop-row"><label>标签页</label><div class="items-list">`;
    b.tabs.forEach((tab,i)=>{
      html += `<div style="background:#0a0f1e;border:1px solid var(--border);border-radius:5px;padding:6px;margin-bottom:6px">
        <div class="item-row" style="margin-bottom:4px">
          <input value="${tab.label||''}" placeholder="标签名" oninput="updateTabItem(${i},'label',this.value)">
          <button class="item-del" onclick="removeTabItem(${i})">✕</button>
        </div>
        <textarea placeholder="内容（支持HTML）" oninput="updateTabItem(${i},'text',this.value)" style="width:100%;min-height:50px">${tab.text||tab.html||''}</textarea>
      </div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addTabItem()">＋ 添加标签</button></div>`;
  } else if(b.type==='media'){
    html += field('图片路径 img','img',b.img,'text') + field('说明文字 alt','alt',b.alt,'text');
  } else if(b.type==='swot'){
    html += field('标题（可选）','title',b.title||'','text');
    html += `<div class="prop-row"><label>优势 Strengths</label><div class="items-list">`;
    (b.S||[]).forEach((item,i)=>{
      html += `<div class="item-row"><input value="${item}" oninput="updateSwotItem('S',${i},this.value)"><button class="item-del" onclick="removeSwotItem('S',${i})">✕</button></div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addSwotItem('S','新优势')">＋ 添加优势</button></div>`;
    html += `<div class="prop-row"><label>劣势 Weaknesses</label><div class="items-list">`;
    (b.W||[]).forEach((item,i)=>{
      html += `<div class="item-row"><input value="${item}" oninput="updateSwotItem('W',${i},this.value)"><button class="item-del" onclick="removeSwotItem('W',${i})">✕</button></div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addSwotItem('W','新劣势')">＋ 添加劣势</button></div>`;
    html += `<div class="prop-row"><label>机会 Opportunities</label><div class="items-list">`;
    (b.O||[]).forEach((item,i)=>{
      html += `<div class="item-row"><input value="${item}" oninput="updateSwotItem('O',${i},this.value)"><button class="item-del" onclick="removeSwotItem('O',${i})">✕</button></div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addSwotItem('O','新机会')">＋ 添加机会</button></div>`;
    html += `<div class="prop-row"><label>威胁 Threats</label><div class="items-list">`;
    (b.T||[]).forEach((item,i)=>{
      html += `<div class="item-row"><input value="${item}" oninput="updateSwotItem('T',${i},this.value)"><button class="item-del" onclick="removeSwotItem('T',${i})">✕</button></div>`;
    });
    html += `</div><button class="add-item-btn" onclick="addSwotItem('T','新威胁')">＋ 添加威胁</button></div>`;
  }

  html += checkField('渐进揭示 frag','frag',b.frag);
  html += `</div>`;
  return html;
}

function renderAnimPanel(){
  const sl = state.slides[state.curSlide];
  return `<div class="prop-section">
    <h3>页面入场动效</h3>
    <div class="anim-grid">
      ${[['fade-up','淡入上升'],['fade-in','淡入'],['slide-left','左滑入'],['zoom','缩放入场'],['none','无动效']].map(([v,n])=>`
      <div class="anim-opt${(sl.anim||'fade-up')===v?' active':''}" onclick="setAnim('${v}',this)">${n}</div>`).join('')}
    </div>
  </div>
  <div class="prop-section">
    <h3>渐进揭示速度</h3>
    <div class="prop-row">
      <label>延迟间隔: <span id="stagger-val">${sl.staggerDelay||80}ms</span></label>
      <input type="range" min="30" max="300" value="${sl.staggerDelay||80}" oninput="setStaggerDelay(this.value)" style="width:100%;margin-top:4px">
    </div>
  </div>
  <div class="prop-section">
    <h3>页面过渡</h3>
    <div class="anim-grid">
      ${[['instant','即时切换'],['fade','淡入淡出'],['slide','横向滑动']].map(([v,n])=>`
      <div class="anim-opt${(sl.transition||'instant')===v?' active':''}" onclick="setTransition('${v}',this)">${n}</div>`).join('')}
    </div>
  </div>`;
}

function field(label,key,val,type){
  if(type==='textarea') return `<div class="prop-row"><label>${label}</label><textarea oninput="updateProp('${key}',this.value)">${val||''}</textarea></div>`;
  return `<div class="prop-row"><label>${label}</label><input value="${(val||'').replace(/"/g,'&quot;')}" oninput="updateProp('${key}',this.value)"></div>`;
}
function checkField(label,key,val){
  return `<div class="prop-row" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="chk-${key}" ${val?'checked':''} onchange="updateProp('${key}',this.checked)" style="width:auto"><label for="chk-${key}" style="margin:0">${label}</label></div>`;
}

// ── 操作函数 ──
function addBlock(type){
  const b = defaultBlock(type);
  state.slides[state.curSlide].blocks.push(b);
  state.curBlock = state.slides[state.curSlide].blocks.length-1;
  state.curTab = 'props';
  switchTab('props', document.querySelectorAll('.pp-tab')[1]);
  refresh();
}
function selectBlock(i){ state.curBlock=i; state.curTab='props'; switchTab('props',document.querySelectorAll('.pp-tab')[1]); renderPropsPanel(); document.querySelectorAll('.block-row').forEach((r,idx)=>r.classList.toggle('selected',idx===i)); }
function removeBlock(i,e){ e&&e.stopPropagation(); state.slides[state.curSlide].blocks.splice(i,1); if(state.curBlock>=i)state.curBlock=Math.max(-1,state.curBlock-1); refresh(); }
function moveBlock(i,dir,e){ e&&e.stopPropagation(); const bl=state.slides[state.curSlide].blocks; const j=i+dir; if(j<0||j>=bl.length)return; [bl[i],bl[j]]=[bl[j],bl[i]]; state.curBlock=j; refresh(); }

function addSlide(){
  state.slides.push({id:mkId(),title:'新页面',layout:'center',blocks:[]});
  state.curSlide=state.slides.length-1; state.curBlock=-1; refresh();
}
function duplicateSlide(){
  const s=JSON.parse(JSON.stringify(state.slides[state.curSlide]));
  s.id=mkId(); s.title=s.title+' 副本';
  state.slides.splice(state.curSlide+1,0,s);
  state.curSlide++; refresh();
}
function deleteSlide(){ deleteSlideAt(state.curSlide,null); }
function deleteSlideAt(i,e){ if(e)e.stopPropagation(); if(state.slides.length<=1)return; state.slides.splice(i,1); state.curSlide=Math.min(i,state.slides.length-1); refresh(); }

function updateProp(key,val){
  const b=state.slides[state.curSlide].blocks[state.curBlock];
  if(!b)return; b[key]=val; renderPreview();
}
function updateNested(side,key,val){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[side][key]=val; renderPreview(); }
function updateNestedItem(side,i,val){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[side].items[i]=val; renderPreview(); }
function addNestedItem(side,val){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[side].items.push(val); refresh(); }
function removeNestedItem(side,i){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[side].items.splice(i,1); refresh(); }
function updateItem(key,i,val){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[key][i]=val; renderPreview(); }
function addItem(key,val){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[key].push(val); refresh(); }
function removeItem(key,i){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[key].splice(i,1); refresh(); }
function updateMetricItem(i,k,v){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.items[i][k]=v; renderPreview(); }
function addMetricItem(){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.items.push({value:'0',unit:'',label:'指标',delta:''}); refresh(); }
function removeMetricItem(i){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.items.splice(i,1); refresh(); }
function updateTimelineItem(i,k,v){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.items[i][k]=v; renderPreview(); }
function addTimelineItem(){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.items.push({time:'新节点',text:'说明'}); refresh(); }
function removeTimelineItem(i){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.items.splice(i,1); refresh(); }
function updateLabels(v){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.labels=v.split(',').map(s=>s.trim()); renderPreview(); }
function updateDataset(i,k,v){ const b=state.slides[state.curSlide].blocks[state.curBlock]; if(k==='data') b.datasets[i].data=v.split(',').map(s=>parseFloat(s.trim())||0); else b.datasets[i][k]=v; renderPreview(); }
function addDataset(){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.datasets.push({label:'新系列',data:b.labels.map(()=>0),color:'#0ea5e9'}); refresh(); }
function removeDataset(i){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.datasets.splice(i,1); refresh(); }
function updateTabItem(i,k,v){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.tabs[i][k]=v; renderPreview(); }
function addTabItem(){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.tabs.push({label:'新标签',text:'内容'}); refresh(); }
function removeTabItem(i){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b.tabs.splice(i,1); refresh(); }
function updateSwotItem(quad,i,val){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[quad][i]=val; renderPreview(); }
function addSwotItem(quad,val){ const b=state.slides[state.curSlide].blocks[state.curBlock]; if(!b[quad])b[quad]=[]; b[quad].push(val); refresh(); }
function removeSwotItem(quad,i){ const b=state.slides[state.curSlide].blocks[state.curBlock]; b[quad].splice(i,1); refresh(); }
function setAnim(v,el){ state.slides[state.curSlide].anim=v; document.querySelectorAll('.anim-opt').forEach(e=>e.classList.remove('active')); if(el)el.classList.add('active'); }
function setStaggerDelay(v){ state.slides[state.curSlide].staggerDelay=+v; document.getElementById('stagger-val').textContent=v+'ms'; }
function setTransition(v,el){ state.slides[state.curSlide].transition=v; renderAnimPanel(); }

// ── 生成预览HTML ──
function buildBlockJS(b){
  switch(b.type){
    case 'hero': return `{type:"hero",kick:${JSON.stringify(b.kick||"")},title:${JSON.stringify(b.title||"")},sub:${JSON.stringify(b.sub||"")}${b.frag?',frag:true':''}}`;
    case 'metric': return `{type:"metric",items:[${(b.items||[]).map(m=>`{value:${JSON.stringify(m.value)},unit:${JSON.stringify(m.unit||"")},label:${JSON.stringify(m.label||"")}${m.delta?',delta:'+JSON.stringify(m.delta):''} }`).join(',')}]${b.frag?',frag:true':''}}`;
    case 'bullets': return `{type:"bullets",title:${JSON.stringify(b.title||"")},items:${JSON.stringify(b.items||[])}${b.stagger?',stagger:true':''}${b.frag?',frag:true':''}}`;
    case 'compare': return `{type:"compare",left:{title:${JSON.stringify(b.left.title||"")},items:${JSON.stringify(b.left.items||[])}},right:{title:${JSON.stringify(b.right.title||"")},items:${JSON.stringify(b.right.items||[])}}${b.frag?',frag:true':''}}`;
    case 'timeline': return `{type:"timeline",items:[${(b.items||[]).map(t=>`{time:${JSON.stringify(t.time)},text:${JSON.stringify(t.text)}}`).join(',')}]${b.frag?',frag:true':''}}`;
    case 'quote': return `{type:"quote",text:${JSON.stringify(b.text||"")},by:${JSON.stringify(b.by||"")}${b.frag?',frag:true':''}}`;
    case 'chart':
      const t=state.themeKey; const colors=['#e8c874','#38bdf8','#34d399','#f87171','#a78bfa'];
      const datasets=(b.datasets||[]).map((ds,i)=>{
        const c=ds.color||colors[i%colors.length];
        const isPie=b.chart==='pie'||b.chart==='doughnut';
        return `{label:${JSON.stringify(ds.label||"")},data:${JSON.stringify(ds.data||[])},${isPie?`backgroundColor:[${colors.map(c=>`"${c}"`).join(',')}]`:`borderColor:"${c}",backgroundColor:"${c}22",tension:0.4,fill:false`}}`;
      }).join(',');
      return `{type:"chart",chart:"${b.chart||'bar'}",title:${JSON.stringify(b.title||"")},data:{labels:${JSON.stringify(b.labels||[])},datasets:[${datasets}]}${b.frag?',frag:true':''}}`;
    case 'tabs': return `{type:"tabs",tabs:[${(b.tabs||[]).map(tab=>`{label:${JSON.stringify(tab.label||"")},text:${JSON.stringify(tab.text||tab.html||"")}}`).join(',')}]${b.frag?',frag:true':''}}`;
    case 'media': return `{type:"media",img:${JSON.stringify(b.img||"")}${b.alt?',alt:'+JSON.stringify(b.alt):''}${b.frag?',frag:true':''}}`;
    case 'swot': return `{type:"swot"${b.title?',title:'+JSON.stringify(b.title):''},strengths:${JSON.stringify(b.S||[])},weaknesses:${JSON.stringify(b.W||[])},opportunities:${JSON.stringify(b.O||[])},threats:${JSON.stringify(b.T||[])}${b.frag?',frag:true':''}}`;
    default: return `{type:"${b.type}"}`;
  }
}

function buildDeckJS(){
  const t=THEMES[state.themeKey];
  const slidesJS=state.slides.map(sl=>{
    const blocksJS=(sl.blocks||[]).map(buildBlockJS).join(',\n    ');
    return `  {title:${JSON.stringify(sl.title||"")},layout:"${sl.layout||'center'}",blocks:[${blocksJS?'\n    '+blocksJS+'\n  ':''} ]}`;
  }).join(',\n');
  return `window.NARRATIVE_DECK = {\n  theme:{blue:"${t.blue}",gold:"${t.gold}",bg:"${t.bg}"},\n  slides:[\n${slidesJS}\n  ]\n};`;
}

:root{--nd-blue:{{B}};--nd-gold:{{G}};--nd-ink:#e8eef9;--nd-sub:#9fb0ca;--nd-bg:{{BG}};--nd-card:rgba(255,255,255,.05);--nd-line:rgba(255,255,255,.1);}

.nd-tabs{width:100%;max-width:880px;}.nd-tabhead{display:flex;gap:5px;margin-bottom:12px;}
.nd-tab{font-family:inherit;font-size:14px;padding:7px 18px;border:1px solid var(--nd-line);background:transparent;color:var(--nd-sub);border-radius:18px;cursor:pointer;transition:.2s;}
.nd-tab.on{background:linear-gradient(145deg,var(--nd-blue),#3b82f6);color:#fff;border-color:transparent;}
.nd-pane{display:none;font-size:18px;line-height:1.6;color:var(--nd-ink);text-align:left;}.nd-pane.on{display:block;}
.nd-media{max-width:100%;max-height:62vh;border-radius:12px;}
#nd-progress{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:30;}
#nd-progress .nd-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);}
#nd-progress .nd-dot.on{background:var(--nd-gold);width:26px;border-radius:4px;}`;

const ENGINE_JS=`"use strict";
const ND={deck:null,cur:0,root:null,
  init(deck){this.deck=deck;this.root=document.getElementById("nd-stage");
    if(deck.theme){const t=deck.theme,rs=document.documentElement.style;
      if(t.blue)rs.setProperty("--nd-blue",t.blue);
      if(t.gold)rs.setProperty("--nd-gold",t.gold);
      if(t.bg)rs.setProperty("--nd-bg",t.bg);}
    this.cur=0;this.render();this.buildProgress();},
  render(){const s=this.deck.slides[this.cur];this.root.innerHTML="";
    const slide=document.createElement("section");
    slide.className="nd-slide nd-layout-"+(s.layout||"center");
    (s.blocks||[]).forEach((b,i)=>{const el=BlockRegistry?BlockRegistry.render(b,i):Blocks.render(b,i);if(el){slide.appendChild(el);el.style.animation="ndIn .5s ease "+(i*0.08)+"s both";}});
    this.root.appendChild(slide);this.updateProgress();},
  buildProgress(){let bar=document.getElementById("nd-progress");if(!bar){bar=document.createElement("div");bar.id="nd-progress";document.body.appendChild(bar);}
    bar.innerHTML="";this.deck.slides.forEach((s,i)=>{const d=document.createElement("div");d.className="nd-dot"+(i===this.cur?" on":"");bar.appendChild(d);});},
  updateProgress(){document.querySelectorAll("#nd-progress .nd-dot").forEach((d,i)=>d.classList.toggle("on",i===this.cur));}};
const Blocks={
  render(b,i){const fn=this[b.type];if(!fn){const d=document.createElement("div");d.className="nd-block";d.textContent="[block:"+b.type+"]";return d;}
    const el=fn.call(this,b,i);el.classList.add("nd-block");if(b.frag)el.setAttribute("data-frag","1");return el;},
  _w(html,cls){const d=document.createElement("div");d.className=cls||"";d.innerHTML=html;return d;},
  hero(b){return this._w('<div class="nd-hero"><div class="nd-kick">'+(b.kick||"")+'</div><h1>'+(b.title||"")+'</h1><div class="nd-goldline"></div><div class="nd-sub">'+(b.sub||"")+'</div></div>',"nd-hero-wrap");},
  metric(b){var its=(b.items||[]).map(function(m){return '<div class="nd-metric"><div class="nd-mnum">'+m.value+'</div><div class="nd-munit">'+(m.unit||"")+'</div><div class="nd-mlabel">'+(m.label||"")+'</div>'+(m.delta?'<div class="nd-mdelta '+(m.delta[0]==="-"?"down":"up")+'">'+m.delta+'</div>':"")+'</div>';}).join("");return this._w('<div class="nd-metrics">'+its+'</div>',"");},
  bullets(b){var lis=(b.items||[]).map(function(t){return "<li>"+t+"</li>";}).join("");var el=this._w((b.title?"<h2>"+b.title+"</h2>":"")+'<ul class="nd-bullets">'+lis+"</ul>","");if(b.stagger)el.querySelectorAll("li").forEach(function(li){li.setAttribute("data-frag","1");});return el;},
  compare(b){function col(c,side){return '<div class="nd-cmp-col '+side+'"><div class="nd-cmp-h">'+(c.title||"")+'</div><ul>'+((c.items||[]).map(function(x){return "<li>"+x+"</li>";}).join(""))+'</ul></div>';}return this._w('<div class="nd-compare">'+col(b.left||{},"L")+'<div class="nd-cmp-vs">VS</div>'+col(b.right||{},"R")+'</div>',"");},
  timeline(b){var ns=(b.items||[]).map(function(t){return '<div class="nd-tl-node"><div class="nd-tl-dot"></div><div class="nd-tl-t">'+(t.time||"")+'</div><div class="nd-tl-c">'+(t.text||"")+'</div></div>';}).join("");return this._w('<div class="nd-timeline">'+ns+'</div>',"");},
  quote(b){return this._w('<blockquote class="nd-quote">'+(b.text||"")+'<cite>'+(b.by||"")+'</cite></blockquote>',"");},
  media(b){if(b.video)return this._w('<video src="'+b.video+'" controls class="nd-media"></video>',"");return this._w('<img src="'+(b.img||"")+'" class="nd-media">',"");},
  chart(b){var el=this._w('<div class="nd-chart-box">'+(b.title?'<div class="nd-chart-t">'+b.title+'</div>':"")+'<canvas></canvas></div>',"");setTimeout(function(){var cv=el.querySelector("canvas");if(window.Chart&&cv){new Chart(cv,{type:b.chart||"bar",data:b.data,options:{responsive:true,plugins:{legend:{labels:{color:"#c3cee0"}}},scales:(b.chart==="pie"||b.chart==="doughnut")?{}:{x:{ticks:{color:"#9fb0ca"}},y:{ticks:{color:"#9fb0ca"}}}}});}},80);return el;},
  tabs(b){var el=this._w('<div class="nd-tabs"><div class="nd-tabhead">'+((b.tabs||[]).map(function(t,i){return '<button class="nd-tab '+(i===0?"on":"")+'" data-i="'+i+'">'+t.label+'</button>';}).join(""))+'</div><div class="nd-tabbody">'+((b.tabs||[]).map(function(t,i){return '<div class="nd-pane '+(i===0?"on":"")+'" data-i="'+i+'">'+(t.html||t.text||"")+'</div>';}).join(""))+'</div></div>',"");el.querySelectorAll(".nd-tab").forEach(function(btn){btn.onclick=function(){var i=btn.dataset.i;el.querySelectorAll(".nd-tab,.nd-pane").forEach(function(x){x.classList.toggle("on",x.dataset.i===i);});};});return el;}
};
window.addEventListener("DOMContentLoaded",function(){if(window.NARRATIVE_DECK)ND.init(window.NARRATIVE_DECK);});`;

function renderPreview(){
  const t=THEMES[state.themeKey];
  const deckJS=buildDeckJS();
  const sl=state.slides[state.curSlide];
  const singleDeck=`window.NARRATIVE_DECK={theme:{blue:"${t.blue}",gold:"${t.gold}",bg:"${t.bg}"},slides:[{title:${JSON.stringify(sl.title||"")},layout:"${sl.layout||'center'}",blocks:[${(sl.blocks||[]).map(buildBlockJS).join(',')}]}]};`;
  const html=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../engine/style.css">
<style>:root{--nd-blue:${t.blue};--nd-gold:${t.gold};--nd-bg:${t.bg};}</style>
</head><body>
<div id="nd-stage"></div><div id="nd-progress"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>
<script src="../engine/block-registry.js"><\/script>
<script src="../engine/core-blocks.js"><\/script>
<script src="../engine/business-blocks.js"><\/script>
<script>${singleDeck}<\/script><script>${ENGINE_JS}<\/script></body></html>`;
  document.getElementById('canvas-preview').srcdoc=html;
  document.getElementById('status-blocks').textContent=sl.blocks.length+' 个Block';
  document.getElementById('status-layout').textContent='layout: '+(sl.layout||'center');
}

// ── 导出 ──
function exportDeck(){
  const js=buildDeckJS();
  const blob=new Blob([js],{type:'text/javascript'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='deck.js';a.click();
}
function exportConfig(){
  const cfg={theme:state.themeKey,slides:state.slides};
  const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='deck-config.json';a.click();
}

// ── 刷新全局 ──
function refresh(){
  renderSlidesList();
  renderPropsPanel();
  renderPreview();
  // 同步布局按钮
  const sl=state.slides[state.curSlide];
  document.querySelectorAll('.layout-btn').forEach(b=>{
    b.classList.toggle('active',b.textContent.includes({center:'居中',left:'左对',grid:'双列',scroll:'滚动'}[sl.layout||'center']?.slice(0,2)||''));
  });
}

// ── 初始化 ──
refresh();
</script>
</body>
