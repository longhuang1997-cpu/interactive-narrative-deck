name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        npm install
        npm install -g http-server
        npx puppeteer browsers install chrome

    - name: Start HTTP server
      run: |
        http-server -p 8080 &
        sleep 3

    - name: Run tests
      run: |
        npm test
