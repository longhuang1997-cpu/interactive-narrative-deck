  <script>
// Block Registry (简化版)
const BlockRegistry = {
  render(block, index) {
    const type = block.type;
    if (type === 'hero') return this.renderHero(block);
    if (type === 'metric') return this.renderMetric(block);
    if (type === 'comparison') return this.renderComparison(block);
    if (type === 'fishbone') return this.renderFishbone(block);
    if (type === 'timeline') return this.renderTimeline(block);
    return null;
  },

  renderHero(block) {
    const div = document.createElement('div');
    div.className = 'nd-block nd-hero';
    div.style.animationDelay = '0s';
    div.innerHTML = `
      <div class="nd-hero-title">${block.title || ''}</div>
      <div class="nd-hero-subtitle">${block.subtitle || ''}</div>
    `;
    return div;
  },

  renderMetric(block) {
    const div = document.createElement('div');
    div.className = 'nd-block nd-metrics';
    div.style.animationDelay = '0.1s';

    const items = block.items || [];
    items.forEach(item => {
      const metric = document.createElement('div');
      metric.className = 'nd-metric';

      const deltaClass = item.trend === 'up' ? 'positive' : 'negative';
      const deltaSymbol = item.trend === 'up' ? '↑' : '↓';

      metric.innerHTML = `
        <div class="nd-metric-label">${item.label || ''}</div>
        <div>
          <span class="nd-metric-value">${item.value || '0'}</span>
          <span class="nd-metric-unit">${item.unit || ''}</span>
        </div>
        ${item.delta ? `<div class="nd-metric-delta ${deltaClass}">${deltaSymbol} ${item.delta}</div>` : ''}
      `;
      div.appendChild(metric);
    });

    return div;
  },

  renderComparison(block) {
    const div = document.createElement('div');
    div.className = 'nd-block nd-comparison';
    div.style.animationDelay = '0.2s';

    const left = block.left || {};
    const right = block.right || {};

    div.innerHTML = `
      <div class="nd-comparison-side">
        <h3>${left.title || '方案A'}</h3>
        <ul>
          ${(left.items || []).map(item => `<li>${item}</li>`).join('')}
        </ul>
      </div>
      <div class="nd-comparison-side highlight">
        <h3>${right.title || '方案B'}</h3>
        <ul>
          ${(right.items || []).map(item => `<li>${item}</li>`).join('')}
        </ul>
      </div>
    `;

    return div;
  },

  renderFishbone(block) {
    const div = document.createElement('div');
    div.className = 'nd-block nd-fishbone';
    div.style.animationDelay = '0.3s';

    const categories = block.categories || [];

    div.innerHTML = `
      <div class="nd-fishbone-problem">${block.problem || '问题'}</div>
      <div class="nd-fishbone-categories">
        ${categories.map(cat => `
          <div class="nd-fishbone-category">
            <h4>${cat.name}</h4>
            <ul class="nd-fishbone-causes">
              ${(cat.causes || []).map(cause => `<li>${cause}</li>`).join('')}
            </ul>
          </div>
        `).join('')}
      </div>
    `;

    return div;
  },

  renderTimeline(block) {
    const div = document.createElement('div');
    div.className = 'nd-block nd-timeline';
    div.style.animationDelay = '0.4s';

    const items = block.items || [];

    div.innerHTML = `
      <div class="nd-timeline-title">${block.title || '时间线'}</div>
      <div class="nd-timeline-items">
        ${items.map(item => `
          <div class="nd-timeline-item">
            <div class="nd-timeline-date">${item.date || ''}</div>
            <div class="nd-timeline-title-item">${item.title || ''}</div>
            <div class="nd-timeline-desc">${item.description || ''}</div>
          </div>
        `).join('')}
      </div>
    `;

    return div;
  }
};

// Deck Data

// Engine
const ND = {
  deck: null,
  cur: 0,
  root: null,

  init(deck) {
    this.deck = deck;
    this.root = document.getElementById("nd-stage");
    this.cur = 0;
    this.render();
    this.buildProgress();
    this.bindKeys();
  },

  render() {
    const s = this.deck.slides[this.cur];
    this.root.innerHTML = "";

    const slide = document.createElement("section");
    slide.className = "nd-slide nd-layout-" + (s.layout || "center");

    (s.blocks || []).forEach((b, bi) => {
      const el = BlockRegistry.render(b, bi);
      if (el) slide.appendChild(el);
    });

    this.root.appendChild(slide);
    this.updateProgress();
  },

  next() {
    if (this.cur < this.deck.slides.length - 1) {
      this.cur++;
      this.render();
    }
  },

  prev() {
    if (this.cur > 0) {
      this.cur--;
      this.render();
    }
  },

  goto(i) {
    if (i >= 0 && i < this.deck.slides.length) {
      this.cur = i;
      this.render();
    }
  },

  bindKeys() {
    document.addEventListener("keydown", e => {
      const k = e.key;
      if (k === "ArrowRight" || k === "PageDown" || k === " ") {
        this.next();
        e.preventDefault();
      } else if (k === "ArrowLeft" || k === "PageUp") {
        this.prev();
        e.preventDefault();
      } else if (k === "Home") {
        this.goto(0);
      } else if (k === "End") {
        this.goto(this.deck.slides.length - 1);
      }
    });
  },

  buildProgress() {
    let bar = document.getElementById("nd-progress");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "nd-progress";
      document.body.appendChild(bar);
    }

    bar.innerHTML = "";
    this.deck.slides.forEach((s, i) => {
      const d = document.createElement("div");
      d.className = "nd-dot";
      d.title = s.title || ("第" + (i + 1) + "页");
      d.onclick = () => this.goto(i);
      bar.appendChild(d);
    });
  },

  updateProgress() {
    document.querySelectorAll("#nd-progress .nd-dot").forEach((d, i) => {
      d.classList.toggle("on", i === this.cur);
    });
  }
};

// Init
window.addEventListener("DOMContentLoaded", () => {

    ND.init(window.NARRATIVE_DECK);

});
